<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ブレイルセンス学習アプリ</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    body { background:#000; color:#fff; font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif; font-weight:700; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
    .wrap { width:100%; max-width:500px; padding:40px 20px 48px; display:flex; flex-direction:column; align-items:center; }
    .app-name { font-size:24px; text-align:center; margin-bottom:8px; letter-spacing:.05em; }
    .app-sub  { font-size:13px; text-align:center; margin-bottom:6px; }
    .app-device { font-size:12px; text-align:center; border:1px solid #fff; border-radius:8px; padding:4px 12px; display:inline-block; margin-bottom:48px; }
    .sec-label { font-size:13px; text-align:center; letter-spacing:.1em; margin-bottom:14px; width:100%; }
    .btn { display:block; width:100%; min-height:80px; padding:16px 20px; border:2px solid #fff; border-radius:14px; background:transparent; color:#fff; font-size:22px; font-weight:700; font-family:inherit; cursor:pointer; text-align:center; margin-bottom:16px; line-height:1.4; }
    .btn:active { background:#1c1c1c; }
    .btn-gold { border-color:#ffe033; color:#ffe033; }
    .btn-gold:active { background:#2a1a00; }
    .divider { width:100%; border:none; border-top:1px solid #fff; margin:24px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="app-name">ブレイルセンス<br>学習アプリ</div>
  <div class="app-sub">BraileSense Six 操作習得</div>
  <div class="app-device">動作確認済み：iPhone / Mac</div>

  <div class="sec-label">── 学習メニュー ──</div>
  <button class="btn" onclick="location.href='app_braille.html'">🔤 点字練習<br><span style="font-size:15px;">アルファベット・日本語</span></button>
  <button class="btn btn-gold" onclick="location.href='app_keyboard.html'">⌨️ キーボード・コマンド学習<br><span style="font-size:15px;">操作・コマンド辞書</span></button>
</div>
</body>
</html>
