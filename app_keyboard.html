<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>キーボード・コマンド学習</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    body { background:#000; color:#fff; font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif; font-weight:700; display:flex; flex-direction:column; align-items:center; }
    .screen { display:none; width:100%; max-width:540px; min-height:100vh; flex-direction:column; padding:14px 16px 36px; }
    .screen.active { display:flex; }

    /* BUTTONS */
    .btn { display:block; width:100%; min-height:64px; padding:12px 20px; border:2px solid #fff; border-radius:14px; background:transparent; color:#fff; font-size:19px; font-weight:700; font-family:inherit; cursor:pointer; text-align:center; margin-bottom:12px; line-height:1.4; }
    .btn:active { background:#1c1c1c; }
    .btn-ok  { border-color:#4ade80; color:#4ade80; }
    .btn-ok:active { background:#0a2316; }
    .btn-ng  { border-color:#ff3333; color:#ff3333; }
    .btn-ng:active { background:#3a0000; }
    .btn-dim { border-color:#fff; color:#fff; }
    .btn-dim:active { background:#222; }
    .btn-gold { border-color:#ffe033; color:#ffe033; }
    .btn-gold:active { background:#2a1a00; }

    /* BACK */
    .back { background:transparent; border:none; color:#fff; font-size:18px; font-weight:700; font-family:inherit; cursor:pointer; padding:4px 0 14px; align-self:flex-start; }
    .back:active { opacity:.6; }

    /* NAV ROW */
    .nav-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }

    /* SCORE */
    .score { width:100%; background:#111; border:1.5px solid #fff; border-radius:10px; padding:9px 16px; font-size:17px; color:#fff; text-align:center; margin-bottom:14px; }

    /* SECTION LABEL */
    .sec-label { font-size:13px; color:#fff; text-align:center; letter-spacing:.1em; margin-bottom:12px; }

    /* フィードバック＋次へ */
    .fb-row { display:flex; gap:9px; width:100%; margin-bottom:12px; min-height:52px; visibility:hidden; }
    .fb-row.show { visibility:visible; }
    .fb-text { flex:1; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; border:2px solid transparent; padding:8px; text-align:center; line-height:1.3; }
    .fb-text.ok { background:#052016; border-color:#4ade80; color:#4ade80; }
    .fb-text.ng { background:#3a0000; border-color:#ff3333; color:#ff3333; }
    .fb-next { min-width:90px; min-height:52px; border:2px solid #fff; border-radius:12px; background:transparent; color:#fff; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; }
    .fb-next:active { background:#1c1c1c; }

    /* 4択 */
    .choices { display:flex; flex-direction:column; gap:9px; width:100%; margin-bottom:12px; }
    .ch { width:100%; min-height:64px; background:#0d0d0d; border:2px solid #fff; border-radius:14px; color:#fff; font-size:17px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:10px 14px; text-align:center; line-height:1.3; }
    .ch:active { background:#1a1a1a; }
    .ch.ok  { border-color:#4ade80; background:#052016; color:#4ade80; }
    .ch.ng  { border-color:#ff3333; background:#3a0000; color:#ff3333; }
    .ch.dim { border-color:#fff; color:#fff; opacity:.35; pointer-events:none; }

    /* 問題ボックス */
    .q-box { width:100%; min-height:90px; background:#0d0d0d; border:2px solid #fff; border-radius:16px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; padding:16px; text-align:center; font-size:20px; line-height:1.4; }

    /* SVGキーボードラッパー */
    .kbd-wrap { width:100%; background:#0d0d0d; border:1.5px solid #fff; border-radius:16px; padding:10px 8px; margin-bottom:12px; }
    .kbd-wrap svg { width:100%; height:auto; display:block; touch-action:manipulation; }
    .kbd-hint { font-size:12px; color:#fff; text-align:center; border:1px solid #fff; border-radius:8px; padding:6px; margin-bottom:10px; }

    /* 選択中キー表示 */
    .selected-area { width:100%; background:#0d0d0d; border:1.5px solid #fff; border-radius:12px; padding:10px 14px; margin-bottom:12px; text-align:center; }
    .selected-label { font-size:12px; color:#fff; margin-bottom:4px; }
    .selected-keys { font-size:18px; color:#ffe033; min-height:28px; }

    /* RESULT */
    .result-box { width:100%; background:#0d0d0d; border:2px solid #fff; border-radius:20px; padding:28px 20px; text-align:center; margin-bottom:20px; }
    .result-pct { font-size:64px; color:#4ade80; line-height:1; margin-bottom:8px; }
    .result-sub { font-size:18px; color:#fff; }

    /* 辞書 */
    .dict-cat { font-size:14px; color:#ffe033; border:1px solid #ffe033; border-radius:8px; padding:4px 10px; margin-bottom:10px; display:inline-block; }
    .dict-item { width:100%; background:#0d0d0d; border:1.5px solid #fff; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
    .dict-cmd  { font-size:16px; color:#fff; margin-bottom:6px; }
    .dict-keys { font-size:18px; color:#ffe033; }
    .dict-note { font-size:12px; color:#fff; margin-top:4px; }
    .dict-scroll { width:100%; overflow-y:auto; }
  </style>
</head>

<script>
// ========== ナビゲーション ==========
let navHistory = [];
window.go = function go(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  navHistory.push(id);
  window.scrollTo(0,0);
}
window.goBack = function goBack() {
  if (navHistory.length <= 1) { location.href='index.html'; return; }
  navHistory.pop();
  const prev = navHistory[navHistory.length-1];
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(prev).classList.add('active');
  window.scrollTo(0,0);
}

// 初期化：navHistoryにホームを積む
navHistory = ['s-home'];
// ハッシュで辞書に直接飛ぶ
if (location.hash === '#dict') { go('s-dict'); }

// ========== データ ==========

// キーボードキー一覧
const KEYS = [
  { name:'点字キー 1',  role:'左手薬指。点1を入力する' },
  { name:'点字キー 2',  role:'左手中指。点2を入力する' },
  { name:'点字キー 3',  role:'左手人差し指。点3を入力する' },
  { name:'点字キー 4',  role:'右手人差し指。点4を入力する' },
  { name:'点字キー 5',  role:'右手中指。点5を入力する' },
  { name:'点字キー 6',  role:'右手薬指。点6を入力する' },
  { name:'バックスペース', role:'1文字削除・前に戻る' },
  { name:'エンター',    role:'決定・改行' },
  { name:'スペース',    role:'スペース入力・コマンド修飾キー' },
  { name:'F1',         role:'メインメニューへ移動・アプリ起動修飾キー' },
  { name:'F2',         role:'機能キー2' },
  { name:'F3',         role:'タブ移動・アプリ起動修飾キー' },
  { name:'F4',         role:'キャンセル・音量操作修飾キー' },
  { name:'Ctrl',       role:'コントロールキー' },
  { name:'Alt',        role:'オルトキー' },
];

// コマンドデータ
const CMDS = [
  // ナビゲーション
  { cat:'ナビゲーション', cmd:'メインメニューに移動',       keys:['F1'] },
  { cat:'ナビゲーション', cmd:'前の項目・行に移動',         keys:['Space','1'] },
  { cat:'ナビゲーション', cmd:'次の項目・行に移動',         keys:['Space','4'] },
  { cat:'ナビゲーション', cmd:'項目の先頭に移動',           keys:['Space','1','2','3'] },
  { cat:'ナビゲーション', cmd:'項目の末尾に移動',           keys:['Space','4','5','6'] },
  { cat:'ナビゲーション', cmd:'左に移動',                  keys:['Space','3'] },
  { cat:'ナビゲーション', cmd:'右に移動',                  keys:['Space','6'] },
  { cat:'ナビゲーション', cmd:'タブ移動',                  keys:['F3'], alt:['Space','4','5'] },
  { cat:'ナビゲーション', cmd:'逆タブ移動',                keys:['Space','F3'], alt:['Space','1','2'] },
  { cat:'ナビゲーション', cmd:'実行中アプリ一覧を表示',     keys:['F1','F4'] },
  { cat:'ナビゲーション', cmd:'実行中アプリを切り替え',     keys:['F2','F3'] },
  { cat:'ナビゲーション', cmd:'開いているアプリをすべて閉じる', keys:['Enter','Space','D'] },
  { cat:'ナビゲーション', cmd:'プログラムを終了',           keys:['Space','Z'] },
  { cat:'ナビゲーション', cmd:'キャンセル・中止して戻る',   keys:['F4'], alt:['Space','E'] },

  { cat:'システム設定・情報', cmd:'日付と時刻を確認',           keys:['Space','T'] },
  { cat:'システム設定・情報', cmd:'バッテリー残量を確認',        keys:['Space','1','6'], note:'メインメニューで' },

  { cat:'アプリ一発起動', cmd:'Google検索を開く',        keys:['F1','G'] },
  { cat:'アプリ一発起動', cmd:'計算機を開く',            keys:['F3','C'] },
  { cat:'アプリ一発起動', cmd:'アラームを設定',          keys:['F3','A'] },
  { cat:'アプリ一発起動', cmd:'サピエを開く',            keys:['F1','Z'] },

// キー表示名
function keysLabel(keys) { return keys.join(' ＋ '); }

// ========== SVG生成 ==========
// キー定義（idで検索できる形）
const SVG_KEYS = [

// コマンドのキー名→SVGキーIDの変換（点字キー1-6はそのまま）
function cmdKeyToSvgId(k) {
  if (k === 'Backspace') return 'Backspace';
  if (k === 'Enter') return 'Enter';
  return k; // F1,F2,F3,F4,Ctrl,Alt,Space,1-6,D,W等はそのまま
}

  // 液晶

  lcd.setAttribute('width','120'); lcd.setAttribute('height','22');
  lcd.setAttribute('rx','4'); lcd.setAttribute('fill','#000');
  lcd.setAttribute('stroke','#fff'); lcd.setAttribute('stroke-width','0.8');
  svgEl.appendChild(lcd);
  const lcdT = document.createElementNS(ns,'text');
  lcdT.setAttribute('x','170'); lcdT.setAttribute('y','25');
  lcdT.setAttribute('text-anchor','middle'); lcdT.setAttribute('font-size','7');
  lcdT.setAttribute('fill','#fff'); lcdT.setAttribute('font-family','sans-serif');
  lcdT.textContent = '液晶ディスプレイ';
  svgEl.appendChild(lcdT);

  // 点字ディスプレイ
  const disp = document.createElementNS(ns,'rect');
  disp.setAttribute('x','22'); disp.setAttribute('y','136');
  disp.setAttribute('width','296'); disp.setAttribute('height','36');
  disp.setAttribute('rx','4'); disp.setAttribute('fill','#0a0a0a');
  disp.setAttribute('stroke','#fff'); disp.setAttribute('stroke-width','0.8');
  disp.setAttribute('stroke-dasharray','3 2');
  svgEl.appendChild(disp);
  const dispT = document.createElementNS(ns,'text');
  dispT.setAttribute('x','170'); dispT.setAttribute('y','158');
  dispT.setAttribute('text-anchor','middle'); dispT.setAttribute('font-size','7');
  dispT.setAttribute('fill','#fff'); dispT.setAttribute('font-family','sans-serif');
  dispT.textContent = '点字ディスプレイ（32セル）';
  svgEl.appendChild(dispT);

  // スピーカー
  [[42,22],[298,22]].forEach(([cx,cy])=>{
    const sp = document.createElementNS(ns,'ellipse');
    sp.setAttribute('cx',cx); sp.setAttribute('cy',cy);
    sp.setAttribute('rx','18'); sp.setAttribute('ry','10');
    sp.setAttribute('fill','none'); sp.setAttribute('stroke','#fff');
    sp.setAttribute('stroke-width','0.8'); sp.setAttribute('stroke-dasharray','2 1.5');
    svgEl.appendChild(sp);

    const isLit = litKeys && litKeys.includes(k.id);
    const fillColor = isLit ? '#ffe033' : '#1a1a1a';
    const textColor = isLit ? '#000' : k.text;
    const g = document.createElementNS(ns,'g');
    g.setAttribute('data-kid', k.id);
    g.style.cursor = onTap ? 'pointer' : 'default';

    let shape;
    if (k.shape === 'ellipse') {
      shape = document.createElementNS(ns,'ellipse');

      shape.setAttribute('rx', k.rx); shape.setAttribute('ry', k.ry);

// ========== ユーティリティ ==========
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick4(correct, pool, keyFn) {
  // pool から正解以外を3つ選ぶ
  const others = shuffle(pool.filter(x=>keyFn(x)!==keyFn(correct))).slice(0,3);
  return shuffle([correct,...others]);
}
function showResult(correct, total, restartFn) {
  const pct = Math.round(correct/total*100);
  document.getElementById('res-pct').textContent = pct+'%';
  document.getElementById('res-sub').textContent = total+'問中'+correct+'問正解';
  document.getElementById('res-restart').onclick = restartFn;
  go('s-result');
}

// --- 高難度：紛らわしいコマンド4択 ---
function getHardChoices(item) {
  // 同じキーを含む「紛らわしい」コマンドを優先して選ぶ
  const itemKeySet = new Set(item.keys);
  const confusing = CMDS.filter(c=>{
    if(c.cmd===item.cmd) return false;
    return c.keys.some(k=>itemKeySet.has(k));
  });
  const shuffled = shuffle(confusing);
  const picked = shuffled.slice(0,3);
  // 3つ足りなければランダムで補完
  if(picked.length<3){
    const rest=shuffle(CMDS.filter(c=>c.cmd!==item.cmd&&!picked.includes(c))).slice(0,3-picked.length);
    picked.push(...rest);
  }
  return shuffle([item,...picked]);
}

  const item=cState.q[cState.idx];

      const altStr=c.alt?'<br>または '+keysLabel(c.alt):'';
      const noteStr=c.note?'<div class="dict-note">※'+c.note+'</div>':'';
      catEl.innerHTML+='<div class="dict-item"><div class="dict-cmd">'+c.cmd+'</div><div class="dict-keys">'+keysLabel(c.keys)+altStr+'</div>'+noteStr+'</div>';
    });
    el.appendChild(catEl);
  });
}
buildDict();
</script>
</body>
</html>
